# Solution de secours. New > Blueprint, puis renseigner PRISME_ADMIN_PASSWORD quand Render le demande.
# Offre gratuite : mise en veille après 15 min, base effacée à chaque veille. Voir docs/DEPLOIEMENT.md.
services:
  - type: web
    name: prisme
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PRISME_MODE
        value: public
      - key: PRISME_REFRESH_MINUTES
        value: "30"
      - key: PRISME_ADMIN_USER
        value: redaction
      - key: PRISME_ADMIN_PASSWORD
        sync: false
