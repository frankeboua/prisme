# New > Blueprint, puis renseigner PRISME_ADMIN_PASSWORD quand Render le demande.
# Offre gratuite : mise en veille après 15 min, base effacée à chaque veille. Voir docs/DEPLOIEMENT.md.
services:
  - type: web
    name: prisme
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PRISME_MODE
        value: public
      - key: PRISME_REFRESH_MINUTES
        value: "30"
      - key: PRISME_ADMIN_USER
        value: redaction
      - key: PRISME_ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PRISME_MAIL_FROM
        sync: false
      # Firebase Authentication : e-mails de confirmation et de réinitialisation, connexion avec Google (docs/DEPLOIEMENT.md, section 5)
      - key: PRISME_FIREBASE_API_KEY
        sync: false
      - key: PRISME_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: PRISME_FIREBASE_PROJECT_ID
        sync: false
      # Google Search Console (balise HTML) et API Google Fact Check Tools (facultative)
      - key: PRISME_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
